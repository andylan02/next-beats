name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack & prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and push schema
        run: |
          pnpm run prisma.push
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed database
        run: pnpm run prisma.seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build (optional)
        run: pnpm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Start dev server (background)
        run: |
          pnpm dev --port 3002 > /tmp/next.log 2>&1 &
          for i in {1..60}; do
            if curl -sSf http://localhost:3002/login >/dev/null; then
              echo "server up"
              break
            fi
            sleep 1
          done
          if ! curl -sSf http://localhost:3002/login >/dev/null; then
            echo "Server failed to start, log follows:" && cat /tmp/next.log
            exit 1
          fi
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Playwright tests
        run: pnpm run test:e2e --reporter=list
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report || ./playwright-report || .

      - name: Upload next dev log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-dev-log
          path: /tmp/next.log
